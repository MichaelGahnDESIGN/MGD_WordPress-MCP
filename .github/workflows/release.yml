name: Build WordPress release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(sed -n 's/^ \* Version: //p' mgd-wordpress-mcp/mgd-wordpress-mcp.php | head -n1 | tr -d '\r')"
          STABLE_TAG="$(sed -n 's/^Stable tag: //p' mgd-wordpress-mcp/readme.txt | head -n1 | tr -d '\r')"
          echo "Git tag:        ${TAG_VERSION}"
          echo "Plugin version: ${PLUGIN_VERSION}"
          echo "Stable tag:     ${STABLE_TAG}"
          test "${TAG_VERSION}" = "${PLUGIN_VERSION}"
          test "${TAG_VERSION}" = "${STABLE_TAG}"

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find mgd-wordpress-mcp -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build mgd-wordpress-mcp.zip
          mkdir -p build/mgd-wordpress-mcp
          rsync -a --delete mgd-wordpress-mcp/ build/mgd-wordpress-mcp/
          cd build
          zip -r ../mgd-wordpress-mcp.zip mgd-wordpress-mcp

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" mgd-wordpress-mcp.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" mgd-wordpress-mcp.zip --generate-notes --title "MGD WordPress MCP ${GITHUB_REF_NAME}"
          fi
