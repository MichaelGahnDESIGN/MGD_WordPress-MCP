name: Build WordPress release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            REQUEST_BRANCH=""
          else
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
            REQUEST_BRANCH="${GITHUB_REF_NAME}"
          fi
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "request_branch=${REQUEST_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          PLUGIN_VERSION="$(sed -n 's/^ \* Version: //p' mgd-wordpress-mcp/mgd-wordpress-mcp.php | head -n1 | tr -d '\r')"
          STABLE_TAG="$(sed -n 's/^Stable tag: //p' mgd-wordpress-mcp/readme.txt | head -n1 | tr -d '\r')"
          echo "Release tag:    ${RELEASE_TAG}"
          echo "Plugin version: ${PLUGIN_VERSION}"
          echo "Stable tag:     ${STABLE_TAG}"
          test "${TAG_VERSION}" = "${PLUGIN_VERSION}"
          test "${TAG_VERSION}" = "${STABLE_TAG}"

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find mgd-wordpress-mcp -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build mgd-wordpress-mcp.zip
          mkdir -p build/mgd-wordpress-mcp
          rsync -a --delete mgd-wordpress-mcp/ build/mgd-wordpress-mcp/
          cd build
          zip -r ../mgd-wordpress-mcp.zip mgd-wordpress-mcp

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" mgd-wordpress-mcp.zip --clobber
          else
            gh release create "${RELEASE_TAG}" mgd-wordpress-mcp.zip --target "${GITHUB_SHA}" --generate-notes --title "MGD WordPress MCP ${RELEASE_TAG}"
          fi

      - name: Remove temporary release request branch
        if: ${{ steps.release.outputs.request_branch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_BRANCH: ${{ steps.release.outputs.request_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "${REQUEST_BRANCH}" || true
